[package]
name = "flake-show-ng"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Show the complete tree of a flake's outputs."
license = "MIT"

[[bin]]
name = "fsn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
